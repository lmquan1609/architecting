<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miracle AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <span class="header-dot"></span>
      <span>Miracle AI Assistant</span>
    </header>

    <div class="messages" id="messages">
      <div class="message assistant">
        <div class="bubble">Hi! Ask me anything about Miracle Technologies.</div>
      </div>
    </div>

    <form class="input-bar" id="form">
      <input
        type="text"
        id="input"
        placeholder="Ask a question…"
        autocomplete="off"
        required
      />
      <button type="submit" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
