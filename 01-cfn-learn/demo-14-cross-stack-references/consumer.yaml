AWSTemplateFormatVersion: '2010-09-09'
Description: Demo 13 - Cross-Stack References (consumer) - imports values from producer stack

Resources:
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Fn::ImportValue pulls the exported value from the producer stack
      VpcId: !ImportValue Demo13-VpcId
      GroupDescription: Allow HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !ImportValue Demo13-VpcId
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: demo-13-private-subnet

Outputs:
  ImportedVpcId:
    Value: !ImportValue Demo13-VpcId
  ImportedSubnetId:
    Value: !ImportValue Demo13-SubnetId
