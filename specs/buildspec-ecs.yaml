version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "274595021951"       # replace with your account ID
    AWS_REGION: "ap-southeast-1"         # replace with your region
    ECR_REPO: "public/demo-lab14"      # replace with your ECR repo name
    ECS_SVC: "my-service" # must match container name in task definition

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
  build:
    commands:
      - echo Building Docker image...
      - cd app/
      - ls -al
      - rm -f index-base.js
      - mv -f index-ecs.js index.js
      - docker build -t $IMAGE_URI .  
  post_build:
    commands:
      - echo Pushing image to ECR...
      - docker push $IMAGE_URI
      - echo Writing imagedefinitions.json...
      - printf '[{"name":"%s","imageUri":"%s"}]' $ECS_SVC $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
  iscard-paths: yes   # Optional: Prevents original local folder structures from being created inside the zip file