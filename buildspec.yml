version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Running tests..."
      - chmod +x test.sh
      - ./test.sh
      - echo "Build completed on $(date)"
artifacts:
  files:
    - '**/*'
