<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Providers Directory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 2rem;
    }
    .form {
      display: grid;
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    input {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #5568d3; }
    .providers {
      display: grid;
      gap: 15px;
    }
    .provider {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .provider:hover { transform: translateY(-2px); }
    .provider-info h3 { color: #333; margin-bottom: 5px; }
    .provider-info p { color: #666; }
    .delete-btn {
      padding: 8px 16px;
      background: #dc3545;
      font-size: 0.9rem;
    }
    .delete-btn:hover { background: #c82333; }
    @media (max-width: 600px) {
      .container { padding: 20px; }
      h1 { font-size: 1.5rem; }
      .provider { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Providers Directory</h1>
    <div class="form">
      <input type="text" id="name" placeholder="Provider Name" required>
      <input type="text" id="city" placeholder="Provider City" required>
      <button onclick="addProvider()">Add Provider</button>
    </div>
    <div class="providers" id="providers"></div>
  </div>

  <script>
    async function loadProviders() {
      const res = await fetch('/api/providers');
      const providers = await res.json();
      document.getElementById('providers').innerHTML = providers.map(p => `
        <div class="provider">
          <div class="provider-info">
            <h3>${p.provider_name}</h3>
            <p>${p.provider_city}</p>
          </div>
          <button class="delete-btn" onclick="deleteProvider(${p.provider_id})">Delete</button>
        </div>
      `).join('');
    }

    async function addProvider() {
      const name = document.getElementById('name').value;
      const city = document.getElementById('city').value;
      if (!name || !city) return;
      const provider_id = Date.now();
      await fetch('/api/providers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider_id, provider_name: name, provider_city: city })
      });
      document.getElementById('name').value = '';
      document.getElementById('city').value = '';
      loadProviders();
    }

    async function deleteProvider(id) {
      await fetch(`/api/providers/${id}`, { method: 'DELETE' });
      loadProviders();
    }

    loadProviders();
  </script>
</body>
</html>
